name: ClaimForge Tests and PostgreSQL Concurrency
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest-cov
      - run: python -m pytest -q tests/test_core.py tests/test_showcase.py --cov=claimforge.core --cov=claimforge.api --cov-report=term-missing --cov-report=json:coverage.json
      - run: python scripts/collect_local_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: claimforge-local-coverage
          path: |
            coverage.json
            LOCAL_TEST_EVIDENCE.json
          retention-days: 30
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claimforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: claimforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://claimforge:ci-only-password@localhost:5432/claimforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify concurrent workers and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -s -q tests/test_postgres_concurrency.py | tee postgres-evidence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claimforge-postgres-concurrency-evidence
          path: |
            postgres-evidence.log
            postgres-evidence.json
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static Python security scan
        run: |
          python -m pip install bandit
          bandit -r claimforge -ll
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
