name: ClaimForge Live Showcase Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live read-only endpoints and metrics
        run: python scripts/live_showcase_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claimforge-live-smoke
          path: live-showcase-smoke.json
          retention-days: 30
