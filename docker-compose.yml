services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimforge
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: claimforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimforge -d claimforge"]
      interval: 2s
      retries: 20
  api:
    build: .
    environment:
      CLAIMFORGE_ENV: development
      CLAIMFORGE_API_KEY: local-dev-key-do-not-use-in-production
      DATABASE_URL: postgresql+psycopg://claimforge:local-development-only@db:5432/claimforge
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "claimforge.worker", "--worker-id", "worker-1", "--iterations", "1000"]
    environment:
      DATABASE_URL: postgresql+psycopg://claimforge:local-development-only@db:5432/claimforge
    depends_on:
      db:
        condition: service_healthy
